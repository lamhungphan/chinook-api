spring.application.name=chinook-api

#Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# JDBC logging
logging.level.org.springframework.jdbc.core=DEBUG
mybatis.mapper-locations=classpath:mapper/*.xml

# Cron job - PriceLogCleanupJob
app.jobs.price-log-cleanup.cron=0 0 2 * * *
app.jobs.price-log-cleanup.retention-days=90
app.jobs.price-log-cleanup.heartbeat-enabled=true
app.jobs.price-log-cleanup.heartbeat-rate-ms=60000

# Quartz - cron trigger (in-memory store)
spring.quartz.job-store-type=memory

# Async / thread pool for parallel track enrichment
app.async.track-enrich.core-pool-size=4
app.async.track-enrich.max-pool-size=16
app.async.track-enrich.queue-capacity=100